<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spitex Cura Mobile – Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f5f1eb;
        --panel: rgba(255, 255, 255, 0.86);
        --card: #ffffff;
        --line: rgba(19, 20, 21, 0.08);
        --text: #1d1d1f;
        --muted: #6c6e73;
        --soft: #7d6a5d;
        --accent: #d57f56;
        --shadow: 0 20px 40px rgba(20, 18, 16, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(213, 127, 86, 0.14), transparent 20%),
          linear-gradient(180deg, #faf8f6 0%, var(--bg) 100%);
        color: var(--text);
      }

      .login-shell {
        width: min(440px, calc(100% - 28px));
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.82);
        border-radius: 28px;
        box-shadow: var(--shadow);
        padding: 24px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, #1d1f22, #4d3d35);
        color: white;
        font-weight: 700;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--soft);
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 1.4rem;
        letter-spacing: -0.04em;
      }

      form {
        display: grid;
        gap: 16px;
      }

      .field-group {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--muted);
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(247, 244, 240, 0.9);
        color: var(--text);
        padding: 12px 14px;
        font: inherit;
      }

      button {
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #1d1f22, #2d2b2a);
        color: white;
        font: inherit;
        font-weight: 700;
        padding: 12px 16px;
        cursor: pointer;
      }

      .hint {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.84rem;
        line-height: 1.5;
      }

      .hint strong {
        color: var(--text);
      }

      .error {
        display: none;
        color: #8a372c;
        background: #fbe9e6;
        border: 1px solid rgba(138, 55, 44, 0.12);
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 0.85rem;
      }

      .error.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="brand">
        <div class="brand-mark">SC</div>
        <div>
          <p class="eyebrow">Betrieb</p>
          <h1>Spitex Cura Mobile</h1>
        </div>
      </div>

      <form id="loginForm">
        <div class="field-group">
          <label for="username">Mitarbeiter</label>
          <input id="username" name="username" type="text" placeholder="z. B. Anita 1" required />
        </div>

        <div class="field-group">
          <label for="password">Passwort</label>
          <input id="password" name="password" type="password" placeholder="Passwort" required />
        </div>

        <div id="loginError" class="error" role="alert"></div>

        <button type="submit">Anmelden</button>
      </form>

      <p class="hint">
        <strong>Standardpasswort:</strong> das Mitarbeiterkonto entspricht dem Namen ohne Leerzeichen, z. B. <strong>Anita 1</strong> → <strong>anita1</strong>
      </p>
    </div>

    <script src="login.js"></script>
  </body>
</html>
